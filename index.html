<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poliponi Festival 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
height:100vh;
overflow:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
background:black;
}

/* BACKGROUND */
.bg{
position:absolute;
width:100%;
height:100%;
background:url('poster.jpg') center/cover no-repeat;
animation:zoom 25s ease-in-out infinite alternate;
filter:brightness(0.4);
}

@keyframes zoom{
from{transform:scale(1);} 
to{transform:scale(1.15);}
}

.overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0.9));
}

.container{
position:relative;
z-index:2;
text-align:center;
animation:fadeIn 2s ease;
}

/* TITLE */
.title{
font-size:70px;
font-weight:800;
color:#ff3c00;
text-shadow:0 0 25px #ff3c00,0 0 50px #ff3c00;
animation:float 3s infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);} 
50%{transform:translateY(-20px);}
}

.ticket{
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:20px;
box-shadow:0 0 40px rgba(255,60,0,0.5);
margin:20px;
backdrop-filter:blur(10px);
}

.ticket h1{color:#ff4d2d;font-size:28px;}
.ticket p{font-size:14px;opacity:0.9;}

/* PROGRESS */
.progress-box{
width:320px;
height:14px;
background:#111;
border-radius:20px;
overflow:hidden;
margin:auto;
box-shadow:0 0 15px rgba(0,255,200,0.3);
}

.progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#ff3c00,#ffd700,#00ffcc,#00ff66);
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:brightness(1);} 
to{filter:brightness(1.5);}
}

#status{margin-top:12px;font-size:14px;color:#00ffcc;}
#terminal{margin-top:10px;font-size:12px;color:#00ffcc;height:70px;}

/* CTA */
.cta-section{margin-top:30px;}

.cta{
padding:15px 45px;
background:linear-gradient(45deg,#ff3c00,#ff8800);
border:none;
border-radius:40px;
font-size:17px;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 20px rgba(255,60,0,0.5);
}

.cta:hover{
transform:scale(1.15);
box-shadow:0 0 40px rgba(255,60,0,1);
}

/* EXTRA TICKET */
.extra{
margin-top:20px;
color:#ffd700;
font-weight:bold;
font-size:14px;
animation:blink 1s infinite;
}

@keyframes blink{
0%,100%{opacity:1;} 
50%{opacity:0.2;}
}

/* COUNTDOWN */
.countdown{
margin-top:15px;
font-size:18px;
color:#00ffcc;
}

/* FADE */
.fadeOut{animation:fade 1s forwards;}
@keyframes fade{to{opacity:0;}}

@keyframes fadeIn{
from{opacity:0;transform:translateY(30px);} 
to{opacity:1;}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">

<div class="title">POLIPONI</div>

<div class="ticket">
<h1>SHEILA ON 7</h1>
<p>BALI • 04.07.2026</p>
<p>Bali United Training Center</p>
</div>

<div class="progress-box">
<div class="progress" id="progress"></div>
</div>

<div id="status">Initializing Event System...</div>
<div id="terminal"></div>

<div class="cta-section">
<button class="cta" onclick="goToSite()">ENTER EVENT</button>
<div class="extra">🔥 TIKET TAMBAHAN 30 ORANG TERCEPAT 🔥</div>
<div class="countdown" id="countdown">Loading countdown...</div>
</div>

</div>

<script>
let progress = 0;
let duration = 20000;
let start = Date.now();

let progressBar = document.getElementById("progress");
let terminal = document.getElementById("terminal");
let statusText = document.getElementById("status");

let logs = [
"Connecting to POLIPONI Server...",
"Scanning ticket database...",
"Verifying access...",
"Synchronizing event data...",
"Finalizing system..."
];

let logIndex = 0;

let interval = setInterval(() => {
let elapsed = Date.now() - start;
progress = (elapsed / duration) * 100;

if(progress >= 100){
progress = 100;
clearInterval(interval);
statusText.innerText = "ACCESS GRANTED";
}

progressBar.style.width = progress + "%";

if(logIndex < logs.length && progress > (logIndex+1)*20){
terminal.innerHTML += logs[logIndex] + "<br>";
logIndex++;
}

},100);

/* ✅ REDIRECT SUDAH DIGANTI KE LINK BARU */
function goToSite(){
document.body.classList.add("fadeOut");
setTimeout(()=>{
window.location.href = "https://soekarnofestrun2026-rgb.github.io/LANDING-PAGE/";
},1000);
}

/* COUNTDOWN */
let count = 30;
let countdownEl = document.getElementById("countdown");

setInterval(()=>{
if(count > 0){
count--;
countdownEl.innerText = "Sisa tiket tambahan: " + count;
} else {
countdownEl.innerText = "Tiket tambahan HABIS";
}
},1000);
</script>

</body>
</html>
